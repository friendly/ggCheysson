# Temporary: diagnose CRAN r-*-macos-x86_64 vignette segfault. Delete when resolved.
name: macos-diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::ragg, any::rmarkdown
      - name: Get 1.0.1 vignettes and CRAN's 1.0.1 package
        run: |
          mkdir -p old-vignettes lib101
          for v in getting-started guerry-maps; do git show v1.0.1:vignettes/$v.Rmd > old-vignettes/$v.Rmd; done
          Rscript -e "install.packages('ggCheysson', lib = 'lib101', repos = 'https://cloud.r-project.org', dependencies = FALSE)"
      - name: Run diagnostics
        run: Rscript .github/diag/run-all.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-out-${{ matrix.os }}
          path: diag-out
