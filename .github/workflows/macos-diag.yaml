# Temporary: diagnose CRAN r-*-macos-x86_64 vignette segfault. Delete when resolved.
name: macos-diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::ragg, any::rmarkdown
      - name: Run diagnostics
        run: Rscript .github/diag/run-all.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-out-${{ matrix.os }}
          path: diag-out
